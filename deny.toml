[advisories]
ignore = [
  #  Unfixable (as of rsa 0.9.6) marvin attack.
  "RUSTSEC-2023-0071",



  # humantime is unmaintained.
  "RUSTSEC-2025-0014",
]
yanked = "deny"

[bans]
multiple-versions = "allow"
deny = [
  # does not have responsible disclosure policy:
  # https://github.com/briansmith/ring#bug-reporting
  {name = "ring"},
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CC-BY-4.0",
  "GPL-2.0",
  "GPL-3.0",
  "ISC",
  "LGPL-2.0",
  "LGPL-3.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
]
